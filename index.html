<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f4ef;
      color: #3f3a36;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .greeting h1 {
      font-size: 38px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    .greeting p {
      color: #817970;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    .points {
      background: #fff;
      padding: 15px 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-align: center;
    }

    .points-number {
      font-size: 25px;
      font-weight: bold;
    }

    .points-label {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #8b8178;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 25px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 23px;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .progress-container {
      margin-bottom: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #817970;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 12px;
      background: #eee9e2;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #b9a89a;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 5px;
      border-bottom: 1px solid #eee9e2;
      gap: 10px;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task input {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #9d8b7d;
    }

    .task-text {
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .task-points {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #9d8b7d;
      white-space: nowrap;
    }

    .add-task {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .add-task input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #e1d9d0;
      border-radius: 12px;
      outline: none;
      font-family: Arial, sans-serif;
    }

    .add-task button {
      border: none;
      background: #8f7d70;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .add-task button:hover {
      opacity: 0.85;
    }

    .reward {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee9e2;
      gap: 10px;
    }

    .reward:last-child {
      border-bottom: none;
    }

    .reward-name {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .reward button {
      border: none;
      background: #eee7df;
      color: #665b54;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .reward button:hover {
      background: #e1d7cd;
    }

    .level {
      margin-top: 25px;
    }

    .level-title {
      display: flex;
      justify-content: space-between;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #8f7d70;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .points {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="greeting">
        <h1 id="greeting">Good morning!</h1>
        <p id="date"></p>
      </div>

      <div class="points">
        <div class="points-number">⭐ <span id="points">0</span></div>
        <div class="points-label">Points</div>
      </div>
    </header>

    <div class="grid">

      <div class="card">

        <h2>Today's Tasks</h2>

        <div class="progress-container">
          <div class="progress-info">
            <span>Daily Progress</span>
            <span id="progressText">0%</span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div id="taskList"></div>

        <div class="add-task">
          <input
            type="text"
            id="taskInput"
            placeholder="Add a task..."
          >

          <button onclick="addTask()">Add</button>
        </div>

        <div class="message" id="message"></div>

      </div>


      <div>

        <div class="card">
          <h2>🛍️ Reward Shop</h2>

          <div class="reward">
            <span class="reward-name">☕ Fancy coffee</span>
            <button onclick="buyReward(100, 'Fancy coffee')">
              100 ⭐
            </button>
          </div>

          <div class="reward">
            <span class="reward-name">📺 Watch a show</span>
            <button onclick="buyReward(200, 'Watch a show')">
              200 ⭐
            </button>
          </div>

          <div class="reward">
            <span class="reward-name">🍕 Favorite dinner</span>
            <button onclick="buyReward(500, 'Favorite dinner')">
              500 ⭐
            </button>
          </div>

          <div class="reward">
            <span class="reward-name">📚 Buy a book</span>
            <button onclick="buyReward(750, 'Buy a book')">
              750 ⭐
            </button>
          </div>

        </div>


        <div class="card level">

          <h2>🏆 Your Level</h2>

          <div class="level-title">
            <span id="levelName">Level 1</span>
            <span id="levelPoints">0 / 500 XP</span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" id="levelFill"></div>
          </div>

        </div>

      </div>

    </div>

  </div>


<script>

  let points = 0;

  let tasks = [
    { text: "Make lesson plans", points: 20, completed: false },
    { text: "Grade papers", points: 15, completed: false },
    { text: "Clean classroom", points: 10, completed: false },
    { text: "Read for 20 minutes", points: 10, completed: false }
  ];


  function updateDate() {

    const now = new Date();

    const hour = now.getHours();

    let greeting = "Good morning!";

    if (hour >= 12 && hour < 18) {
      greeting = "Good afternoon!";
    }

    if (hour >= 18) {
      greeting = "Good evening!";
    }

    document.getElementById("greeting").textContent = greeting;

    const date = now.toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

    document.getElementById("date").textContent = date;
  }


  function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach((task, index) => {

      const div = document.createElement("div");

      div.className = "task" + (task.completed ? " completed" : "");

      div.innerHTML = `
        <div class="task-left">

          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${index})"
          >

          <span class="task-text">
            ${task.text}
          </span>

        </div>

        <span class="task-points">
          +${task.points} ⭐
        </span>
      `;

      list.appendChild(div);

    });

    updateProgress();
  }


  function toggleTask(index) {

    tasks[index].completed = !tasks[index].completed;

    if (tasks[index].completed) {

      points += tasks[index].points;

      showMessage("Great job! +" + tasks[index].points + " ⭐");

    } else {

      points -= tasks[index].points;

    }

    updatePoints();

    renderTasks();

  }


  function addTask() {

    const input = document.getElementById("taskInput");

    const text = input.value.trim();

    if (!text) return;

    tasks.push({
      text: text,
      points: 10,
      completed: false
    });

    input.value = "";

    renderTasks();

  }


  function updateProgress() {

    const completed = tasks.filter(task => task.completed).length;

    const total = tasks.length;

    const percentage = total === 0
      ? 0
      : Math.round((completed / total) * 100);

    document.getElementById("progressText").textContent =
      percentage + "%";

    document.getElementById("progressFill").style.width =
      percentage + "%";

  }


  function updatePoints() {

    document.getElementById("points").textContent = points;

    updateLevel();

  }


  function updateLevel() {

    const level = Math.floor(points / 500) + 1;

    const levelStart = (level - 1) * 500;

    const current = points - levelStart;

    document.getElementById("levelName").textContent =
      "Level " + level;

    document.getElementById("levelPoints").textContent =
      current + " / 500 XP";

    const percentage = (current / 500) * 100;

    document.getElementById("levelFill").style.width =
      percentage + "%";

  }


  function buyReward(cost, name) {

    if (points < cost) {

      showMessage(
        "You need " + (cost - points) + " more ⭐."
      );

      return;

    }

    points -= cost;

    updatePoints();

    showMessage(
      "You purchased: " + name + " 🎉"
    );

  }


  function showMessage(text) {

    const message = document.getElementById("message");

    message.textContent = text;

    setTimeout(() => {
      message.textContent = "";
    }, 3000);

  }


  updateDate();

  renderTasks();

  updatePoints();

</script>

</body>
</html>
